<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 140">
  <defs>
    <!-- Degrades Dark Obsidian -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0e12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#151821;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0c0f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b949e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombre portee subtile -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Dark Obsidian -->
  <rect width="100%" height="100%" rx="12" fill="url(#obsidianBg)" stroke="#21262d" stroke-width="2"/>

  <!-- Icone : Forged Anvil / Terminal Hex -->
  <g transform="translate(25, 20)">
    <!-- Hexagone Obsidian -->
    <path d="M50 5 L90 27 L90 73 L50 95 L10 73 L10 27 Z" fill="#161b22" stroke="url(#neonAccent)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Symbole CLI Embed >_ -->
    <path d="M32 38 L48 50 L32 62" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="56" y1="62" x2="68" y2="62" stroke="url(#neonAccent)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Typographie Entreprise Pro -->
  <!-- kernforgex -->
  <text x="140" y="68" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">kernforgex</text>
  
  <!-- -parser -->
  <text x="355" y="68" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="300" fill="url(#neonAccent)">-parser</text>
  
  <!-- Sous-titre : CLI PARSING -->
  <text x="142" y="98" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="6" fill="#6e7681">CLI PARSING</text>

  <!-- Ligne d'accentuation minimale -->
  <line x1="142" y1="108" x2="490" y2="108" stroke="#21262d" stroke-width="1"/>
</svg>
